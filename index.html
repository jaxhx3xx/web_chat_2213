<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>메시지</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <button class="back-button" type="button" aria-label="뒤로 가기">‹</button>
        <div class="profile-dot" aria-hidden="true">💬</div>
        <div class="chat-title">
          <h1>메시지</h1>
          <span>온라인</span>
        </div>
      </header>
      <ul id="messages"></ul>
      <form id="chat-form">
        <input type="text" id="chat-input" placeholder="메시지를 입력하세요" autocomplete="off" />
        <button type="submit" aria-label="메시지 보내기"></button>
      </form>
    </div>
    <script src="client.js"></script>
  </body>
</html>
